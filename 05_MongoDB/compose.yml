services:
  # ---------------------------------------------------------------------------
  # MongoDB — the document database. Students load products.json into it and
  # run all queries here via mongosh.
  # ---------------------------------------------------------------------------
  mongodb:
    container_name: mongodb
    image: mongo:${MONGO_VERSION:-8.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      # mongoimport reads files from the server's filesystem, so the sample
      # data must be mounted into the container. Read-only: the exercises
      # never write to it.
      - ./sample_data:/sample_data:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      retries: 5
      start_period: 20s
    restart: always

  # ---------------------------------------------------------------------------
  # Mongo Express — web UI for browsing collections at http://localhost:8081
  #
  # ME_CONFIG_MONGODB_URL is set explicitly because the image's entrypoint
  # otherwise waits on a hardcoded host named `mongo`, which does not resolve
  # here (our service is `mongodb`) and floods the logs with retry errors.
  # ---------------------------------------------------------------------------
  mongo-express:
    container_name: mongo-express
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0.2}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # The UI's own login. Without these the image falls back to the
      # well-known default admin:pass and warns about it on every start.
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-pass}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  mongodb_data:
