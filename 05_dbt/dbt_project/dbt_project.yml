name: retail_dbt
version: "1.0.0"
profile: retail_dbt         # must match the top key in profiles.yml

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

models:
  retail_dbt:
    +materialized: table

seeds:
  retail_dbt:
    +schema: raw             # seeds land in the "raw" schema so they are
                             # clearly separate from the modeled tables
